    cards:
      - type: button
        name: Stânga
        icon: mdi:arrow-left
        tap_action:
          action: perform-action
          perform_action: rest_command.xiaomi_left
      - type: button
        name: Sus
        icon: mdi:arrow-up
        tap_action:
          action: perform-action
          perform_action: rest_command.xiaomi_up
      - type: button
        name: Jos
        icon: mdi:arrow-down
        tap_action:
          action: perform-action
          perform_action: rest_command.xiaomi_down
      - type: button
        name: Dreapta
        icon: mdi:arrow-right
        tap_action:
          action: perform-action
          perform_action: rest_command.xiaomi_right

